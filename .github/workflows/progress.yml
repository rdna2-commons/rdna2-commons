# Regenerates the progress page and chart from the task board, every 6 hours.
# They are written to the `status` branch, not main: main only changes through reviewed pull requests, and the
# README embeds the chart from `status`. Runs trusted code from main only.
name: progress
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: read
concurrency:
  group: progress
jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/issues?state=all&labels=task&per_page=100" | jq -s add > /tmp/issues.json
          gh api --paginate "repos/${{ github.repository }}/pulls?state=all&per_page=100" | jq -s add > /tmp/pulls.json
      - name: Build
        run: |
          mkdir -p /tmp/status/images
          python3 -I tools/progress.py /tmp/issues.json /tmp/pulls.json results --svg /tmp/status/images/progress.svg > /tmp/status/PROGRESS.md
      - name: Publish to the status branch
        run: |
          git config user.name "commons-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin status; then git switch -q status; else git switch -q --orphan status; git rm -rq . || true; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/status/. .
          git add -A
          if git diff --cached --quiet -I '^Generated '; then exit 0; fi
          git commit -qm "Progress: regenerate"
          git push -q origin status
