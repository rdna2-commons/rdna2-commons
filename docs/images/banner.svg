<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Scarlett Commons: shared tests and tools for Xbox Series to PC compatibility">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b33"/>
      <stop offset="1" stop-color="#3b0d1e"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2da44e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <!-- 32 lanes of a wave, some agreeing (green), some not yet checked (grey) -->
  <g transform="translate(820 70)">
    <g fill="url(#lane)">
      <rect x="0" y="0" width="12" height="12" rx="2"/><rect x="16" y="0" width="12" height="12" rx="2"/>
      <rect x="32" y="0" width="12" height="12" rx="2"/><rect x="48" y="0" width="12" height="12" rx="2"/>
      <rect x="64" y="0" width="12" height="12" rx="2"/><rect x="80" y="0" width="12" height="12" rx="2"/>
      <rect x="96" y="0" width="12" height="12" rx="2"/><rect x="112" y="0" width="12" height="12" rx="2"/>
      <rect x="0" y="16" width="12" height="12" rx="2"/><rect x="16" y="16" width="12" height="12" rx="2"/>
      <rect x="32" y="16" width="12" height="12" rx="2"/><rect x="48" y="16" width="12" height="12" rx="2"/>
      <rect x="64" y="16" width="12" height="12" rx="2"/><rect x="80" y="16" width="12" height="12" rx="2"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.18">
      <rect x="96" y="16" width="12" height="12" rx="2"/><rect x="112" y="16" width="12" height="12" rx="2"/>
      <rect x="0" y="32" width="12" height="12" rx="2"/><rect x="16" y="32" width="12" height="12" rx="2"/>
      <rect x="32" y="32" width="12" height="12" rx="2"/><rect x="48" y="32" width="12" height="12" rx="2"/>
      <rect x="64" y="32" width="12" height="12" rx="2"/><rect x="80" y="32" width="12" height="12" rx="2"/>
      <rect x="96" y="32" width="12" height="12" rx="2"/><rect x="112" y="32" width="12" height="12" rx="2"/>
      <rect x="0" y="48" width="12" height="12" rx="2"/><rect x="16" y="48" width="12" height="12" rx="2"/>
      <rect x="32" y="48" width="12" height="12" rx="2"/><rect x="48" y="48" width="12" height="12" rx="2"/>
      <rect x="64" y="48" width="12" height="12" rx="2"/><rect x="80" y="48" width="12" height="12" rx="2"/>
      <rect x="96" y="48" width="12" height="12" rx="2"/><rect x="112" y="48" width="12" height="12" rx="2"/>
    </g>
    <rect x="72" y="64" width="12" height="12" rx="2" fill="#cf222e"/>
    <text x="0" y="104" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8b949e">v_div_fmas_f64  →  expect 0x3c300000</text>
    <text x="0" y="128" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8b949e">one rounding, on every GPU</text>
  </g>
  <text x="72" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">Scarlett Commons</text>
  <text x="74" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c9d1d9">Shared tests, specs and tools for Xbox Series X|S → PC compatibility</text>
  <text x="74" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Verified once, on real hardware, for every project · Built by people and AI agents · No game data, ever</text>
</svg>
